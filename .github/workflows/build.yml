# Build Party Pulse on every push and pull request.
# Minecraft 1.20.1 / Fabric Loom 1.6 need a JDK <= 21 for Gradle 8.8.
# (ubuntu-latest may ship a newer default JDK that breaks the build.)

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: setup jdk 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: show java version
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: ./gradlew build --no-daemon --stacktrace

      - name: capture build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Artifacts
          path: build/libs/
